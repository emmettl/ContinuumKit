name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuumkit-metal
  cancel-in-progress: false

jobs:
  package:
    # Dedicated physical Mac mini; no unreviewed pull-request execution on this host.
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and clean consumer
        env:
          CONTINUUMKIT_REQUIRE_METAL: "1"
          CONTINUUMKIT_ABSORBING_CYLINDER_OUTPUT: ${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ADMITTANCE_OUTPUT: ${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_CYLINDER_OUTPUT: ${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_MASKED_OUTPUT: ${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_OBLIQUE_OUTPUT: ${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_RIGID_3D_OUTPUT: ${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_BOUNDARY_OUTPUT: ${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ACOUSTIC_OUTPUT: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_BENCHMARK_OUTPUT: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Scripts/check.sh
      - name: Retain adiabatic conformance histories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete analytic acoustic reference reports
        run: python3 Scripts/verify-acoustic-output.py "${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain acoustic references and staggered fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete mixed-axis and impedance references
        run: python3 Scripts/verify-boundary-output.py "${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete boundary fields and summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete three-dimensional reference fields
        run: python3 Scripts/verify-rigid-3d-output.py "${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete three-dimensional reference fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete damped oblique reference fields
        run: python3 Scripts/verify-oblique-output.py "${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete oblique fields, reflection and work reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oblique-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete masked-domain reference fields
        run: python3 Scripts/verify-masked-output.py "${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete masked fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete cylinder-domain reference fields
        run: python3 Scripts/verify-cylinder-output.py "${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete cylinder fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete admittance-domain reference fields
        run: python3 Scripts/verify-admittance-output.py "${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete admittance fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admittance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete coupled absorbing-cylinder references
        run: python3 Scripts/verify-absorbing-cylinder-output.py "${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete absorbing-cylinder reference fields and work
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
