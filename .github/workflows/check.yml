name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuumkit-metal
  cancel-in-progress: false

jobs:
  package:
    # Dedicated physical Mac mini; no unreviewed pull-request execution on this host.
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and clean consumer
        env:
          CONTINUUMKIT_REQUIRE_METAL: "1"
        run: bash Scripts/check.sh
