name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuumkit-metal
  cancel-in-progress: false

jobs:
  package:
    # Dedicated physical Mac mini; no unreviewed pull-request execution on this host.
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and clean consumer
        env:
          CONTINUUMKIT_REQUIRE_METAL: "1"
          CONTINUUMKIT_ACOUSTIC_OUTPUT: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_BENCHMARK_OUTPUT: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Scripts/check.sh
      - name: Retain adiabatic conformance histories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete analytic acoustic reference reports
        run: python3 Scripts/verify-acoustic-output.py "${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain acoustic references and staggered fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
