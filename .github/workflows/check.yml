name: Check

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Complete package verification or bounded CPU execution evidence
        type: choice
        options: [all, cpu-throughput, metal-throughput, fitting-audit, weighted-qr-audit, through-origin-audit, through-origin-comparison]
        default: all

permissions:
  contents: read

concurrency:
  group: continuumkit-metal
  cancel-in-progress: false

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'all'
    # Dedicated physical Mac mini; no unreviewed pull-request execution on this host.
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Build and clean consumer
        env:
          CONTINUUMKIT_REQUIRE_METAL: "1"
          CONTINUUMKIT_AFFINE_OUTPUT: ${{ runner.temp }}/affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_QR_OUTPUT: ${{ runner.temp }}/pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ORIGIN_OUTPUT: ${{ runner.temp }}/origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_REAL_FFT_OUTPUT: ${{ runner.temp }}/real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_EULER_FLUX_OUTPUT: ${{ runner.temp }}/euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_GAS_PACKET_OUTPUT: ${{ runner.temp }}/gas-packet-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_GAS_WALL_OUTPUT: ${{ runner.temp }}/gas-wall-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_EXTRUDED_LAYOUT_OUTPUT: ${{ runner.temp }}/extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_TILTED_PULSE_OUTPUT: ${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ABSORBING_CYLINDER_OUTPUT: ${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ADMITTANCE_OUTPUT: ${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_CYLINDER_OUTPUT: ${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_MASKED_OUTPUT: ${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_OBLIQUE_OUTPUT: ${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_RIGID_3D_OUTPUT: ${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_BOUNDARY_OUTPUT: ${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ACOUSTIC_OUTPUT: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_BENCHMARK_OUTPUT: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash Scripts/check.sh
      - name: Retain exact through-origin inputs, integer witnesses and references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete pivoted QR factors, reusable RHS and independent references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete affine fits and exact native reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete packed real FFT and independent reference evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete Euler states, wall ledgers and continuum refinements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
      - name: Retain complete gas-packet states, ledgers and source conformance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-packet-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gas-packet-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
      - name: Retain complete gas-wall source and conformance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gas-wall-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gas-wall-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
      - name: Retain adiabatic conformance histories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adiabatic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete analytic acoustic reference reports
        run: python3 Scripts/verify-acoustic-output.py "${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain acoustic references and staggered fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acoustic-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete mixed-axis and impedance references
        run: python3 Scripts/verify-boundary-output.py "${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete boundary fields and summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boundary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boundary-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete three-dimensional reference fields
        run: python3 Scripts/verify-rigid-3d-output.py "${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete three-dimensional reference fields
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rigid-3d-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete damped oblique reference fields
        run: python3 Scripts/verify-oblique-output.py "${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete oblique fields, reflection and work reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oblique-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oblique-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete masked-domain reference fields
        run: python3 Scripts/verify-masked-output.py "${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete masked fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: masked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/masked-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete cylinder-domain reference fields
        run: python3 Scripts/verify-cylinder-output.py "${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete cylinder fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete admittance-domain reference fields
        run: python3 Scripts/verify-admittance-output.py "${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete admittance fields, occupancy and connectivity reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admittance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/admittance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete coupled absorbing-cylinder references
        run: python3 Scripts/verify-absorbing-cylinder-output.py "${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete absorbing-cylinder reference fields and work
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/absorbing-cylinder-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete tilted-pulse reference fields and patch work
        run: python3 Scripts/verify-tilted-pulse-output.py "${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}" --reference
      - name: Retain complete tilted pulse references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tilted-pulse-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

      - name: Require complete independent extrusion references
        run: python3 Scripts/extruded_layout.py verify "${{ runner.temp }}/extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete independent geometry layouts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extruded-layout-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  cpu-throughput:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'cpu-throughput'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare complete alpha8 and current CPU execution with repeated timings
        run: bash Scripts/check-cpu-wave-throughput.sh "${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require complete native fields and receiver histories
        run: python3 Scripts/verify-cpu-wave-throughput.py "${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  metal-throughput:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'metal-throughput'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Profile unchanged barriers and compare complete field receiver and clock outputs
        run: bash Scripts/check-metal-wave-throughput.sh "${{ runner.temp }}/metal-throughput-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete source profiling and command evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metal-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14

  fitting-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'fitting-audit'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit protected affine kernels against exact native rational references
        run: bash Scripts/check-affine-fit-audit.sh "${{ runner.temp }}/fitting-audit-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete inputs/bits, findings and protected numerical bindings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fitting-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fitting-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  weighted-qr-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'weighted-qr-audit'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit protected weighted QR and actual stencils against exact native references
        run: bash Scripts/check-weighted-qr-audit.sh "${{ runner.temp }}/weighted-qr-audit-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete matrices, factors, solutions, stencils and numerical findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weighted-qr-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weighted-qr-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  through-origin-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'through-origin-audit'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify protected material projection arithmetic and exact native references
        run: bash Scripts/check-through-origin-audit.sh "${{ runner.temp }}/through-origin-audit-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain full native projection terms, references and rejecting controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: through-origin-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/through-origin-audit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  through-origin-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'through-origin-comparison'
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact released QR and scaled projection against independent references
        run: bash Scripts/check-through-origin-comparison.sh "${{ runner.temp }}/through-origin-comparison-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete QR factors, direct projection terms and independent references
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: through-origin-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/through-origin-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
