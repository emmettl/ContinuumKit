name: CPU throughput
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuumkit-metal
  cancel-in-progress: false
jobs:
  compare:
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare complete alpha8 and current CPU execution with repeated timings
        run: bash Scripts/check-cpu-wave-throughput.sh "${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Independently require complete native fields and receiver histories
        run: python3 Scripts/verify-cpu-wave-throughput.py "${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Retain complete execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cpu-throughput-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
