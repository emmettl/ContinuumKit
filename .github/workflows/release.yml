name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag, such as 0.1.0-alpha.1
        required: true
        type: string
      retain_on_host:
        description: Retain complete raw evidence on the verification host for external archival instead of GitHub uploads
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuumkit-metal
  cancel-in-progress: false

# The checks load some scripts as modules, and a Python that writes bytecode (Homebrew's 3.15 on
# the runner since 18 October 2026) leaves Scripts/__pycache__ in the checkout, which the clean
# tree tests then refuse.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, metal, continuumkit]
    timeout-minutes: 30
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Supply a semantic-version tag without a v prefix." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tagged package
        env:
          VERSION: ${{ inputs.version }}
          RETAIN_ON_HOST: ${{ inputs.retain_on_host }}
          CONTINUUMKIT_REQUIRE_METAL: "1"
          CONTINUUMKIT_AFFINE_OUTPUT: ${{ runner.temp }}/affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_QR_OUTPUT: ${{ runner.temp }}/pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_ORIGIN_OUTPUT: ${{ runner.temp }}/origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_REAL_FFT_OUTPUT: ${{ runner.temp }}/real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          CONTINUUMKIT_EULER_FLUX_OUTPUT: ${{ runner.temp }}/euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if test "$RETAIN_ON_HOST" = true; then
            export CONTINUUMKIT_EVIDENCE_DIR="${HOME}/Library/Caches/ContinuumKitReleaseEvidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          nice -n 15 bash Scripts/check-low-impact.sh "$VERSION"

      - name: Retain exact-tag pivoted QR factors, reusable RHS and independent references
        if: always() && !inputs.retain_on_host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pivoted-qr-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain exact through-origin inputs, integer witnesses and references
        if: always() && !inputs.retain_on_host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/origin-least-squares-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete affine fits and exact native reference evidence
        if: always() && !inputs.retain_on_host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/affine-fit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain complete packed real FFT and independent reference evidence
        if: always() && !inputs.retain_on_host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-fft-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

      - name: Retain exact-tag Euler native states and independent refinement evidence
        if: always() && !inputs.retain_on_host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/euler-flux-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --generate-notes --title "$VERSION")
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$VERSION" "${options[@]}"
