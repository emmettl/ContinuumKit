name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semantic-version tag, such as 0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Supply a semantic-version tag without a v prefix." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tagged package
        env:
          VERSION: ${{ inputs.version }}
        run: bash Scripts/check.sh "$VERSION"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release for verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--verify-tag --generate-notes --title "$VERSION")
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$VERSION" "${options[@]}"
